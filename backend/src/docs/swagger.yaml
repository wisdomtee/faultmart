openapi: 3.0.0

info:
  title: FaultMart API
  version: 1.0.0
  description: |
    FaultMart Backend API Documentation

servers:
  - url: http://localhost:5000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Authentication
  - name: Users
  - name: Listings
  - name: Favorites
  - name: Offers
  - name: Conversations
  - name: Messages
  - name: Orders
  - name: Deliveries
  - name: Reviews
  - name: Reports
  - name: Notifications

paths:

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: John

                lastName:
                  type: string
                  example: Doe

                email:
                  type: string
                  example: john@example.com

                password:
                  type: string
                  example: Password123

      responses:
        "201":
          description: Registration successful

  /api/auth/login:
    post:
      tags:
        - Authentication

      summary: Login

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - email
                - password

              properties:

                email:
                  type: string
                  example: john@example.com

                password:
                  type: string
                  example: Password123

      responses:
        "200":
          description: Login successful

  /api/auth/me:
    get:
      tags:
        - Authentication

      security:
        - bearerAuth: []

      summary: Get current user

      responses:
        "200":
          description: Current authenticated user

  /api/auth/logout:
    post:
      tags:
        - Authentication

      security:
        - bearerAuth: []

      summary: Logout

      responses:
        "200":
          description: Logout successful

  /api/auth/refresh:
    post:
      tags:
        - Authentication

      summary: Refresh access token

      responses:
  200:
    description: Notifications retrieved successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            success:
              type: boolean
            message:
              type: string
            data:
              type: array
              items:
                $ref: '#/components/schemas/Notification'